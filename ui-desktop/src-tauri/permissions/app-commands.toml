# Permissions for the commands this application registers itself.
#
# Tauri only checks its access-control list against an application's own
# commands once the application has a manifest of its own; without this file
# every command above is reachable from the webview whether or not a capability
# grants it. Adding the manifest is what turns the check on, which is why every
# command is listed: once it is on, a command that is not granted is refused.
#
# One permission per command, named the way Tauri names them — `allow-` followed
# by the command with its underscores as hyphens. `deny-` variants exist for
# more than this application needs, so they are left out until something wants
# one: a command that is not granted is already refused.

[[permission]]
identifier = "allow-accept-invite"
description = "Enables the accept_invite command without any pre-configured scope."
commands.allow = ["accept_invite"]

