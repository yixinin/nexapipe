default_backend = "http://10.0.0.72:15666"
debug = true

[iroh]
# Relay server URL (optional)
# Use a custom relay server for connection establishment and hole punching
# relay_url = "https://relay.iroh.network"

# Relay mode: "disabled", "default", "custom"
# disabled: do not use a relay (pure peer-to-peer connections)
# default: use the default iroh relay
# custom: use a custom relay (requires relay_url to be set)
# relay_mode = "custom"

# Bind port for iroh endpoint (optional)
# bind_port = 4433

# Secret key for stable endpoint identity (optional)
# If set, the server reuses the same Node ID on every startup,
# which produces a stable connection Ticket so clients do not need to update it each time.
# Run `nexapipe --generate-secret` to generate a new secret key
# secret_key = "your-generated-secret-key-here"

[server]
listen_addr = "0.0.0.0:8080"
tls_enabled = false
cert_path = ""
key_path = ""

[[routes]]
host_pattern = "mt.iroh.iakl.top"
path_pattern = "/"
path_is_prefix = true
strategy = "round_robin"
backends = ["http://host.docker.internal:8063"]
cert_path = ""
key_path = ""

[[routes]]
host_pattern = "fn.iroh.iakl.top"
path_pattern = "/"
path_is_prefix = true
strategy = "round_robin"
backends = ["http://host.docker.internal:15666"]
cert_path = ""
key_path = ""

[[routes]]
host_pattern = "comfyui.iroh.iakl.top"
path_pattern = "/"
path_is_prefix = true
strategy = "round_robin"
backends = ["http://10.0.0.222:8188"]
cert_path = ""
key_path = ""

[local_proxy]
enabled = true
listen_addr = "127.0.0.1:8081"
proxy_domains = [
    "fn.iroh.iakl.top",
    "comfyui.iroh.iakl.top",
    "mt.iroh.iakl.top",
]
# Global load balancing strategy (optional), defaults to round_robin
strategy = "round_robin"
# strategy = "random"

# Multi-node configuration (recommended)
# Each node configures its own server_node_id/server_ticket and the domains it serves.
# The same domain can be configured on multiple nodes to enable load balancing.
[[local_proxy.nodes]]
server_node_id = ""
domains = ["fn.iroh.iakl.top", "mt.iroh.iakl.top"]

[acme]
# Enable automatic certificate management
enabled = false

# Email address for Let's Encrypt account
email = "your-email@example.com"

# ACME directory URL (Let's Encrypt production)
directory_url = "https://acme-v02.api.letsencrypt.org/directory"

# Cloudflare API token (required for DNS challenge)
# Create token with Zone.DNS:Edit permissions at https://dash.cloudflare.com/profile/api-tokens
cloudflare_api_token = "your-cloudflare-api-token"

# Directory to store certificates
certs_dir = "./certs"

# Renew certificate before expiry (days)
renew_before_days = 30

# Domains to obtain certificates for
domains = ["fn.iroh.iakl.top"]
