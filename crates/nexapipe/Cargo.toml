[package]
name = 'nexapipe'
version = '0.1.0'
edition = '2024'

[dependencies]
clap = { version = '4.6.1', features = ['derive'] }
iroh.workspace = true
iroh-tickets.workspace = true
quinn.workspace = true
rand = '0.10.1'
tokio.workspace = true
tracing = '0.1.44'
tracing-subscriber = { version = '0.3.23', features = ['env-filter', 'registry', 'chrono'] }
anyhow.workspace = true
http.workspace = true
url.workspace = true
toml = '1.1.2'
serde = { version = '1.0.228', features = ['derive'] }
serde_json = '1.0'
# iroh's QUIC handshake needs a process-wide rustls CryptoProvider; see main.rs.
rustls.workspace = true
chrono = { version = '0.4.45', features = ['serde'] }
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-stream.workspace = true
flate2 = '1.0'
bytes.workspace = true
hex = '0.4'
nexapipe-client = { path = '../nexapipe-client', features = ['local-proxy'] }
nexapipe-proto.workspace = true
# 2FA support
totp-rs = { version = '5.6', features = ['gen_secret'] }
base32 = '0.4'
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
duct = '1.1.1'
nix = { version = '0.31.3', features = ['signal', 'process'] }
rqrr = { version = "0.9", default-features = false }
tempfile = '3.8'
