[package]
name = "nexapipe-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Iroh-based proxy client library supporting multiple platforms"
keywords = ["iroh", "proxy", "p2p", "quinn"]
categories = ["network-programming"]
license.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]

# No `#[bench]` function lives in this crate, so cargo's default bench target
# for it is a harness with nothing to run — and it is built and *run* in the
# release profile by `cargo bench`, which is the slowest profile there is.
# Turning it off says so, and leaves `cargo bench` to the criterion targets
# below, which are the ones there are numbers for.
bench = false

[dependencies]
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring"] }
# The Android context, and only the Android build needs it: the server links
# this crate for its `--local-proxy` mode, and a mobile-only dependency in the
# server's tree is a mobile-only dependency in the server's build.
ndk-context = { version = "0.1", optional = true }
iroh-tickets = { version = "1.0.0" }
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.103"
http = "1.4.2"
url = "2.5.8"
bytes = "1.12.0"
futures-util = "0.3.32"
tokio-stream = "0.1"
hyper = { version = "1.10.1", features = ["full", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["ring", "http1", "http2"] }
http-body-util = "0.1"
rustls-native-certs = { version = "0.8.4", optional = true }
webpki-roots = { version = "1.0.8", optional = true }
uniffi = { version = "0.32", optional = true }
tracing = { version = "0.1.44", optional = true }
jni = { version = "0.22", features = ["invocation"], optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.15", optional = true }
once_cell = "1.19"
fastrand = "2.1"
nexapipe-proto.workspace = true
netstack-smoltcp = { version = "0.2", optional = true }
libc = { version = "0.2", optional = true }
# 2FA support
# `zeroize` so the TOTP validator wipes its own copy of the seed when it is
# dropped: the validator is built from the secret, and without this it kept a
# second copy of the credential in the heap for as long as the process lived.
totp-rs = { version = "6.0", features = ["gen_secret", "zeroize"] }
base32 = "0.5"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# Wiping credentials from memory when they go out of scope; see
# `src/secret.rs`, which is the only place this crate uses it.
zeroize.workspace = true

[features]
default = ["native-certs", "tracing"]
native-certs = ["dep:rustls-native-certs"]
webpki-roots = ["dep:webpki-roots"]
local-proxy = ["tokio/net"]
uniffi = ["dep:uniffi", "local-proxy"]
tracing = ["dep:tracing"]
jni = ["dep:jni", "dep:log", "dep:android_logger", "dep:ndk-context"]
tun-proxy = ["local-proxy", "dep:netstack-smoltcp", "dep:libc"]

[target.'cfg(target_os = "ios")'.dependencies]
webpki-roots = "1.0.8"

[dev-dependencies]
# The benchmarks; see docs/benchmarks.md.
criterion = { workspace = true }

# Both benches live behind the features the code they measure is behind: the
# TUN pump is the `tun-proxy` half, and the forwarding path is the
# `local-proxy` half, which `tun-proxy` already pulls in.
[[bench]]
name = "tun_pump"
harness = false
required-features = ["tun-proxy"]

[[bench]]
name = "forwarding_path"
harness = false
required-features = ["local-proxy"]

# The local proxy on a plain HTTP request: the path a browser takes when it
# uses the proxy for ordinary HTTP rather than for a tunnel. The CONNECT
# tunnel is measured by `forwarding_path`; this is the other way a request
# goes through the same proxy, and it is the one `forwarding_path` does not
# cover.
[[bench]]
name = "local_request"
harness = false
required-features = ["local-proxy"]

# The client asking whether a name is one of its own. It is a bench of its own
# because it is the only place a long list of names is walked on every request.
[[bench]]
name = "domain_match"
harness = false

# How many QUIC connections a hundred concurrent flows open. The number is a
# property of the flow model rather than of the network, and it is what says
# whether the client is paying for a handshake per flow.
[[bench]]
name = "flow_connections"
harness = false
required-features = ["local-proxy"]

# What one TCP flow costs in the TUN stack. It is an example rather than a
# benchmark because what it measures is memory, not time: see the file itself.
[[example]]
name = "tun_flow_memory"
required-features = ["tun-proxy"]
