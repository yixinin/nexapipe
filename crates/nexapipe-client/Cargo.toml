[package]
name = "nexapipe-client"
version = "0.1.0"
edition = "2024"
description = "Iroh-based proxy client library supporting multiple platforms"
keywords = ["iroh", "proxy", "p2p", "quinn"]
categories = ["network-programming"]
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring"] }
ndk-context = "0.1"
iroh-tickets = { version = "1.0.0" }
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.103"
http = "1.4.2"
url = "2.5.8"
bytes = "1.12.0"
futures-util = "0.3.32"
tokio-stream = "0.1"
hyper = { version = "1.10.1", features = ["full", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "ring",
    "http1",
    "http2",
] }
http-body-util = "0.1"
rustls-native-certs = { version = "0.8.4", optional = true }
webpki-roots = { version = "1.0.8", optional = true }
uniffi = { version = "0.25", optional = true }
tracing = { version = "0.1.44", optional = true }
jni = { version = "0.21", features = ["invocation"], optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.14", optional = true }
once_cell = "1.19"
fastrand = "2.1"

[features]
default = ["native-certs", "tracing"]
native-certs = ["dep:rustls-native-certs"]
webpki-roots = ["dep:webpki-roots"]
local-proxy = ["tokio/net"]
uniffi = ["dep:uniffi"]
tracing = ["dep:tracing"]
jni = ["dep:jni", "dep:log", "dep:android_logger"]

[target.'cfg(target_os = "ios")'.dependencies]
webpki-roots = "1.0.8"

[build-dependencies]
uniffi_bindgen = { version = "0.25", optional = true }
