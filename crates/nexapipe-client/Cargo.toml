[package]
name = "nexapipe-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Client library for the nexapipe proxy: connection pooling, domain routing, a local HTTP proxy and a smoltcp TUN proxy over iroh/QUIC"
keywords = ["iroh", "proxy", "p2p", "quinn", "tunnel"]
categories = ["network-programming"]
license.workspace = true
readme = 'README.md'
repository = 'https://github.com/open-nexa/nexapipe'
homepage = 'https://github.com/open-nexa/nexapipe'
documentation = 'https://docs.rs/nexapipe-client'

[lib]
crate-type = ["lib", "cdylib"]

# No `#[bench]` function lives in this crate, so cargo's default bench target
# for it is a harness with nothing to run — and it is built and *run* in the
# release profile by `cargo bench`, which is the slowest profile there is.
# Turning it off says so, and leaves `cargo bench` to the criterion targets
# below, which are the ones there are numbers for.
bench = false

[dependencies]
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring"] }
# The Android context, and only the Android build needs it: the server links
# this crate for its `--local-proxy` mode, and a mobile-only dependency in the
# server's tree is a mobile-only dependency in the server's build.
ndk-context = { version = "0.1", optional = true }
iroh-tickets = { version = "1.0.0" }
# The quinn fork iroh itself builds on. The lock file resolves one copy of it, so
# `noq_proto::congestion::Bbr3Config` and iroh's `ControllerFactory` are the same
# types — needed for the congestion controller in `src/transport.rs`.
noq-proto.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.103"
http = "1.4.2"
url = "2.5.8"
bytes = "1.12.0"
futures-util = "0.3.32"
tokio-stream = "0.1"
hyper = { version = "1.10.1", features = ["full", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["ring", "http1", "http2"] }
http-body-util = "0.1"
rustls-native-certs = { version = "0.8.4", optional = true }
webpki-roots = { version = "1.0.8", optional = true }
uniffi = { version = "0.32", optional = true }
tracing = { version = "0.1.44", optional = true }
jni = { version = "0.22", features = ["invocation"], optional = true }
log = { version = "0.4", optional = true }
android_logger = { version = "0.15", optional = true }
once_cell = "1.19"
fastrand = "2.1"
nexapipe-proto.workspace = true
# `zeroize` for the buffer a received message is read into: a message may
# carry a credential — the secret an enrollment hands out — and the buffer
# wipes itself when it goes out of scope, so the credential does not stay in
# the heap. See `src/auth/message.rs`.
zeroize.workspace = true
netstack-smoltcp = { version = "0.2", optional = true }
libc = { version = "0.2", optional = true }
# 2FA support
# `zeroize` so the TOTP validator wipes its own copy of the seed when it is
# dropped: the validator is built from the secret, and without this it kept a
# second copy of the credential in the heap for as long as the process lived.
totp-rs = { version = "6.0", features = ["gen_secret", "zeroize"] }
base32 = "0.5"
hex = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
# The challenge a response answers is signed with HMAC-SHA256, and the
# credential is wiped when it goes out of scope. Both live in `nexapipe-proto`
# now, which both sides link — so neither the hash nor the wipe is named here.

[features]
default = ["native-certs", "tracing"]
native-certs = ["dep:rustls-native-certs"]
webpki-roots = ["dep:webpki-roots"]
local-proxy = ["tokio/net"]
uniffi = ["dep:uniffi", "local-proxy"]
tracing = ["dep:tracing"]
jni = ["dep:jni", "dep:log", "dep:android_logger", "dep:ndk-context"]
tun-proxy = ["local-proxy", "dep:netstack-smoltcp", "dep:libc"]

# What docs.rs builds the page from. Without this it builds with the default
# features alone, and eight of this crate's twenty-three modules are behind a
# feature that no default carries: `tun_proxy` (the smoltcp stack), `dns`,
# `virtual_ip` and `virtual_block` (behind `tun-proxy`), `local_proxy` and
# `l4` (behind `local-proxy`), `jni` (the Android bridge) and
# `uniffi_bindings` (the bindings for an app that is not written in Rust). A
# reader who only ever sees the documentation would conclude that they do not
# exist.
#
# All four features build on Linux, which is what docs.rs builds on: the CI
# job "client features" checks each of these feature sets on ubuntu-latest,
# and the two that pull a platform dependency in (the JNI bridge and the UniFFI
# bindings) carry their non-Android path explicitly.
#
# `native-certs` and `webpki-roots` are left out on purpose: they name the
# trust store, and this crate does not use either of them — the server does.
[package.metadata.docs.rs]
features = ["tun-proxy", "local-proxy", "jni", "uniffi"]

[target.'cfg(target_os = "ios")'.dependencies]
webpki-roots = "1.0.8"

[dev-dependencies]
# The benchmarks; see docs/benchmarks.md.
criterion = { workspace = true }

# Both benches live behind the features the code they measure is behind: the
# TUN pump is the `tun-proxy` half, and the forwarding path is the
# `local-proxy` half, which `tun-proxy` already pulls in.
[[bench]]
name = "tun_pump"
harness = false
required-features = ["tun-proxy"]

[[bench]]
name = "forwarding_path"
harness = false
required-features = ["local-proxy"]

# The local proxy on a plain HTTP request: the path a browser takes when it
# uses the proxy for ordinary HTTP rather than for a tunnel. The CONNECT
# tunnel is measured by `forwarding_path`; this is the other way a request
# goes through the same proxy, and it is the one `forwarding_path` does not
# cover.
[[bench]]
name = "local_request"
harness = false
required-features = ["local-proxy"]

# The client asking whether a name is one of its own. It is a bench of its own
# because it is the only place a long list of names is walked on every request.
[[bench]]
name = "domain_match"
harness = false

# What one connection costs: a handshake, and a flow on a connection that is
# already open. It is a bench of its own because it is the number a decision
# about choosing the protocol with ALPN needs, and no other bench has it.
[[bench]]
name = "connection_cost"
harness = false
required-features = ["local-proxy"]

# How many QUIC connections a hundred concurrent flows open. The number is a
# property of the flow model rather than of the network, and it is what says
# whether the client is paying for a handshake per flow.
[[bench]]
name = "flow_connections"
harness = false
required-features = ["local-proxy"]

# What one TCP flow costs in the TUN stack. It is an example rather than a
# benchmark because what it measures is memory, not time: see the file itself.
[[example]]
name = "tun_flow_memory"
required-features = ["tun-proxy"]

# What one connection costs in memory. An example for the same reason: the
# number is memory, not time, and the time is the benchmark's job.
[[example]]
name = "connection_memory"
