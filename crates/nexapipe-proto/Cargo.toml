[package]
name = 'nexapipe-proto'
version.workspace = true
edition = '2024'
rust-version.workspace = true
description = 'The wire formats the nexapipe client and server share'
license.workspace = true
publish = false

# No `#[bench]` function lives in this crate, so cargo's default bench target
# for it is a harness with nothing to run — and it is built and *run* in the
# release profile by `cargo bench`, which is the slowest profile there is.
# Turning it off says so, and leaves `cargo bench` to the criterion targets
# in the crates that have them, which are the ones there are numbers for.

[lib]
bench = false

[dependencies]
# Four dependencies, and all of them are already in every build that links
# this crate: the handshake is JSON, the credential it carries is wiped from
# memory when it goes out of scope, and the challenge a response answers is
# signed with HMAC-SHA256.
#
# The crate used to be dependency-free, and the reason it was is still the
# reason — it must stay cheap to compile for the Android target — but the two
# crates that link it, the server and every client, pull in serde, zeroize,
# hmac and sha2 for themselves, so the marginal cost of naming them here is
# zero. The alternative was a feature nobody would ever leave switched off.
serde = { version = "1.0.228", features = ["derive"] }
# The handshake is JSON, and the error a bad message produces is a
# `serde_json::Error` — it is part of the signature of `AuthMessage::from_bytes`,
# so it is a dependency rather than a test-only one.
serde_json = "1.0"
zeroize.workspace = true
# The challenge a response answers is signed with HMAC-SHA256. It used to be
# signed once in the server and once in the client, with a comment in each
# copy saying to keep them in step; the signature now lives here, once.
hmac = "0.13"
sha2 = "0.11"
