name: Release

# 推送 v* tag 时构建多平台产物并创建 GitHub Release。
# 也可手动触发（workflow_dispatch），需填入一个已存在的 tag。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag，例如 v0.1.0"
        required: true
        type: string

# 构建阶段只需要读权限；发布阶段单独提权（见 release job）
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BIN_NAME: nexapipe

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # 单个平台失败时继续构建其余平台，便于定位问题
      fail-fast: false
      matrix:
        include:
          # ---------- Linux (glibc) ----------
          # x86_64 直接在 runner 上原生构建；aarch64 通过 cross(Docker) 交叉编译
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true

          # ---------- Linux (musl, 静态链接) ----------
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true

          # ---------- macOS (在 arm64 runner 上交叉编译出 Intel 版本) ----------
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false

          # ---------- Windows (在 x64 runner 上交叉编译出 arm64 版本) ----------
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建 tag: $TAG (version=$VERSION)"

      # 仅提醒，不阻塞发布：tag 与 Cargo.toml 里的版本号不一致
      - name: Warn on version mismatch
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -n "$CARGO_VERSION" ] && [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::warning::tag ${TAG_NAME} 与 Cargo.toml workspace 版本 ${CARGO_VERSION} 不一致"
          fi

      - name: Install Rust target
        if: ${{ !matrix.cross }}
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      # cross 在容器内自带对应目标的 gcc/musl-gcc 与 ring 所需的 C 工具链
      - name: Build (cross)
        if: ${{ matrix.cross }}
        shell: bash
        run: cross build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN_NAME }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN_NAME }}

      - name: Smoke test
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: ./target/${{ matrix.target }}/release/${BIN_NAME} --version

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PKG="${BIN_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/$PKG/"
          cp config.toml config.toml.2fa.example LICENSE "dist/$PKG/"
          tar -czf "dist/$PKG.tar.gz" -C dist "$PKG"
          rm -rf "dist/$PKG"
          ls -lh dist

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "$env:BIN_NAME-$env:VERSION-${{ matrix.target }}"
          $stage = "dist/$pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" $stage
          Copy-Item config.toml, config.toml.2fa.example, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$pkg.zip" -Force
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # gh release 需要写权限
    permissions:
      contents: write
    steps:
      # gh 需要工作目录是一个 git 仓库；fetch-depth: 0 让 --generate-notes 能对比上一个 tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ${BIN_NAME}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，覆盖上传产物"
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --title "$TAG_NAME" \
              --generate-notes \
              --verify-tag
          fi
