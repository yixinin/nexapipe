name: Release

# One tag, one release, three products:
#   build          - the nexapipe server binary + client cdylib, 8-platform matrix
#   build-desktop  - the Tauri desktop app, 6-platform matrix (nsis / dmg / deb /
#                    rpm / appimage + the updater manifests merged into latest.json)
#   build-apk      - the signed Android APKs, one per ABI (cargo-ndk .so per ABI +
#                    gradle assembleRelease with ABI splits)
#   build-image    - the container image, one leg per architecture, pushed by
#                    digest to ghcr.io/open-nexa/nexapipe
#   publish-image  - merges those per-arch images into one manifest list, tags
#                    it (the version, plus "latest" for a stable tag), and then
#                    signs the published digest and attests its provenance
#   release        - assembles every artifact into a single GitHub Release with one
#                    SHA256SUMS.txt
#
# Artifact naming, one rule for all three products:
#
#   <product>-<version>-<platform>.<ext>
#
#   product   "nexapipe" for the server archives, "nexa" for the GUI (the desktop
#             bundles and the APK, i.e. tauri.conf.json productName / app_name)
#   version   bare semver, no leading "v" (0.2.0, 0.2.0-rc.1)
#   platform  the cargo target triple for the server (musl vs. glibc is part of it),
#             "<os>-<cpu>" for the GUI: macos-aarch64, windows-x86_64, linux-x86_64,
#             android-arm64, android-x86_64
#
# Tauri's own bundle names break that rule (nexa_0.2.0_amd64.deb, nexa-0.2.0-1.x86_64.rpm,
# an arch-less nexa.app.tar.gz), so ui-desktop/.github/scripts/stage-artifact.mjs renames
# them — and any .sig that was made for the old name is regenerated right after.
#
# Signing rule: a release publishes signed artifacts, or it does not publish.
#
# The desktop bundles are signed with the mechanism of their own platform — a
# Developer ID certificate plus notarization on macOS, an Authenticode
# certificate on Windows — and the Android APK with the release keystore. A
# platform whose signing material is missing fails the job before anything is
# built, so an unsigned artifact never reaches a Release: macOS Gatekeeper and
# Windows SmartScreen refuse such an artifact, and the person who installs it
# is told nothing about why.
#
# The one exception is deliberate and visible: a manual run with
# "allow_unsigned" lists the platforms that are published unsigned on purpose.
# Those platforms are published unsigned — the material is not handed to the
# bundler at all — the job log says so, and the release notes carry a warning
# at the top. A tag push has no such input, so a release made by tagging is
# always signed.
#
# Can also be triggered manually (workflow_dispatch); an existing tag must be
# provided.
#
# The "signing_only" input runs the signing checks and nothing else: it checks
# the Android release keystore and the desktop signing material (the Developer
# ID certificate on macOS, the Authenticode certificate on Windows), and it
# builds and publishes nothing. It is the answer to "are the signing secrets in
# place?", so a value that is missing fails the run and is named in the log — a
# check that cannot fail answers nothing.
#
# The one exception is deliberate: a platform listed in "allow_unsigned" is
# reported as the platform that would be published unsigned, and the run does
# not fail on it. That is a decision somebody makes on purpose.
#
# Pre-release rule: a tag whose name contains a hyphen (v0.2.0-rc.1, v0.2.0-beta.1)
# is published as a GitHub pre-release, so a release-candidate tag cannot take over
# "latest". A plain tag (v1.0.0) is published as a normal release. The same rule in
# every job.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v0.1.0"
        required: true
        type: string
      signing_only:
        description: "Run the signing checks only — the Android keystore and the desktop certificates — and skip every build and every publishing step"
        required: false
        type: boolean
        default: false
      allow_unsigned:
        description: "Publish these desktop platforms unsigned (macos,windows) — a deliberate test build; the release notes say so"
        required: false
        type: string
        default: ""

# The build stage only needs read access; the release stage elevates separately (see the release job)
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BIN_NAME: nexapipe
  # Client crate; its cdylib is built as well (crate-type includes cdylib)
  LIB_NAME: nexapipe-client

jobs:
  build:
    name: build ${{ matrix.target }}
    if: ${{ inputs.signing_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # Keep building the remaining platforms if one fails, to make issues easier to locate
      fail-fast: false
      matrix:
        include:
          # ---------- Linux (glibc) ----------
          # x86_64 is built natively on the runner; aarch64 is cross-compiled via cross (Docker)
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true

          # ---------- Linux (musl, statically linked) ----------
          # musl defaults to crt-static, and rustc then decides the target cannot produce a
          # cdylib: cargo only warns ("dropping unsupported crate type `cdylib`") and exits 0,
          # so the .so simply does not exist when packaging runs. -C target-feature=-crt-static
          # brings it back. It is applied to the cdylib step only (see "Build client cdylib"),
          # so the nexapipe binary itself stays statically linked. Never put it in
          # .cargo/config.toml — that would make every musl binary dynamic.
          #
          # Expect the same warning from the binary step above, and ignore it: cargo builds
          # the client's cdylib slot even when the client is only a dependency, because it is
          # a workspace member, and there is no way to drop the crate type for one target
          # only — a platform-specific `[target.'cfg(...)'.lib]` key is not supported by
          # cargo. The rlib is what the binary needs, and that is what gets built.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            lib_rustflags: -C target-feature=-crt-static
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            lib_rustflags: -C target-feature=-crt-static

          # ---------- macOS (cross-compile the Intel build on an arm64 runner) ----------
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false

          # ---------- Windows (cross-compile the arm64 build on an x64 runner) ----------
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-07-17
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The tag object itself, not just the commit it points at: the tag
          # check below tells an annotated tag from a lightweight one.
          fetch-tags: true

      - name: Resolve version
        shell: bash
        env:
          # Through the environment rather than into the script text: a value
          # interpolated into a `run:` block is text the shell runs, and a
          # dispatch input is a value somebody typed.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building tag: $TAG (version=$VERSION)"

      # The tag has to name the version this tree builds, and it has to be an
      # annotated tag. Both are failures, not warnings: a release published
      # under a tag that does not match the version carries server binaries
      # that report a different version than the release they were downloaded
      # from, and nobody notices until a user compares `nexapipe --version`
      # with the release page.
      #
      # The annotated requirement is the same in every job: a lightweight tag
      # is a bare ref to a commit, and anybody with push access can move it,
      # while the release is signed and published against the tag.
      - name: Verify the release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid v<major>.<minor>.<patch>"
            exit 1
          fi

          WORKSPACE_VERSION="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{line=$0; sub(/^[^=]*=[[:space:]]*/,"",line); gsub(/["[:space:]]/,"",line); print line; exit}' Cargo.toml)"
          if [ -z "$WORKSPACE_VERSION" ]; then
            echo "::error::could not read the workspace version out of Cargo.toml"
            exit 1
          fi
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match the workspace version ${WORKSPACE_VERSION} in Cargo.toml: this release would carry binaries that report a different version"
            exit 1
          fi

          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || echo missing)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::the tag ${TAG} is not an annotated tag (git says '${TAG_TYPE}'): a lightweight tag is a bare ref that anybody with push access can move, and the release is published and signed against the tag. Create it with 'git tag -a ${TAG} -m \"...\"'."
            exit 1
          fi

          echo "tag ${TAG} is an annotated tag and matches the workspace version ${WORKSPACE_VERSION}"

      - name: Install Rust target
        if: ${{ !matrix.cross }}
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 @ 2026-08-06
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2 @ 2026-10-16
        with:
          tool: cross@0.2.5

      # cross ships the target's gcc/musl-gcc and the C toolchain required by ring inside the container
      - name: Build (cross)
        if: ${{ matrix.cross }}
        shell: bash
        run: cross build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN_NAME }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN_NAME }}

      # Client cdylib. Note: every #[no_mangle] export lives in jni.rs (only compiled with the
      # jni feature), and jni.rs depends on LocalProxy, so local-proxy must be enabled too;
      # otherwise the build produces no exported symbols at all.
      - name: Build client cdylib (cross)
        if: ${{ matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          # Per-target rustc flags must go through CARGO_TARGET_<TRIPLE>_RUSTFLAGS under cross;
          # a plain RUSTFLAGS would be dropped inside the container.
          if [ -n "${{ matrix.lib_rustflags }}" ]; then
            var="CARGO_TARGET_$(printf '%s' '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
            export "$var=${{ matrix.lib_rustflags }}"
            echo "Using $var=${{ matrix.lib_rustflags }}"
          fi
          cross build --release --locked --target ${{ matrix.target }} -p ${{ env.LIB_NAME }} --features jni,local-proxy

      - name: Build client cdylib (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.lib_rustflags }}" ]; then
            var="CARGO_TARGET_$(printf '%s' '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
            export "$var=${{ matrix.lib_rustflags }}"
            echo "Using $var=${{ matrix.lib_rustflags }}"
          fi
          cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.LIB_NAME }} --features jni,local-proxy

      # config.toml is gitignored (it is the operator's live config), so the archive ships the
      # example instead; README.md is included so an unpacked release still documents the format.
      - name: Resolve artifact file names
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows)
              echo "BIN_FILE=${BIN_NAME}.exe" >> "$GITHUB_ENV"
              echo "LIB_FILE=nexapipe_client.dll" >> "$GITHUB_ENV"
              # MSVC also emits an import library, which is convenient for linking from C/C++
              echo "LIB_FILE_EXTRA=nexapipe_client.dll.lib" >> "$GITHUB_ENV"
              ;;
            macOS)
              echo "BIN_FILE=${BIN_NAME}" >> "$GITHUB_ENV"
              echo "LIB_FILE=libnexapipe_client.dylib" >> "$GITHUB_ENV"
              echo "LIB_FILE_EXTRA=" >> "$GITHUB_ENV"
              ;;
            *)
              echo "BIN_FILE=${BIN_NAME}" >> "$GITHUB_ENV"
              echo "LIB_FILE=libnexapipe_client.so" >> "$GITHUB_ENV"
              echo "LIB_FILE_EXTRA=" >> "$GITHUB_ENV"
              ;;
          esac

      # Fail here, with the release directory listed, instead of letting the packaging step
      # die on an opaque `cp: cannot stat ...`.
      - name: Verify built artifacts
        shell: bash
        run: |
          set -euo pipefail
          dir="target/${{ matrix.target }}/release"
          missing=0
          for f in "$BIN_FILE" "$LIB_FILE"; do
            if [ ! -f "$dir/$f" ]; then
              echo "::error::expected artifact is missing: $dir/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- $dir ---"
            ls -l "$dir" || true
            exit 1
          fi
          ls -lh "$dir/$BIN_FILE" "$dir/$LIB_FILE"

      - name: Smoke test
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: ./target/${{ matrix.target }}/release/${BIN_FILE} --version

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PKG="${BIN_NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/${BIN_FILE}" "dist/$PKG/"
          cp "target/${{ matrix.target }}/release/${LIB_FILE}" "dist/$PKG/"
          cp config.toml.2fa.example README.md LICENSE "dist/$PKG/"
          tar -czf "dist/$PKG.tar.gz" -C dist "$PKG"
          rm -rf "dist/$PKG"
          ls -lh dist

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = "$env:BIN_NAME-$env:VERSION-${{ matrix.target }}"
          $stage = "dist/$pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_FILE" $stage
          Copy-Item "target/${{ matrix.target }}/release/$env:LIB_FILE" $stage
          if ($env:LIB_FILE_EXTRA -and (Test-Path "target/${{ matrix.target }}/release/$env:LIB_FILE_EXTRA")) {
            Copy-Item "target/${{ matrix.target }}/release/$env:LIB_FILE_EXTRA" $stage
          }
          Copy-Item config.toml.2fa.example, README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$pkg.zip" -Force
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-07
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # Desktop app (migrated from open-nexa/nexa-desktop). src-tauri depends on
  # ../../crates/nexapipe-client — the same checkout provides both, no more
  # floating-main clone.
  # ----------------------------------------------------------------------
  build-desktop:
    name: desktop ${{ matrix.os }}-${{ matrix.arch }}
    if: ${{ inputs.signing_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # The publishing jobs run in an environment, so the repository can put
    # an approval rule in front of them: a job that runs the tagged tree's
    # own code while holding the signing keys, the release keystore and
    # write access to the package registry is a job that deserves a second
    # pair of eyes. The environment is created by the first run that uses
    # it; the rules are the repository's to set.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows ----
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows
            arch: arm64
            # GitHub-hosted native arm64 Windows runner: avoids cross-compiling on x64,
            # which would require an extra ARM64 MSVC toolchain.
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis

          # ---- macOS ----
          # macos-13 (the last x64 image) is retired; x64 now uses macos-15-intel.
          - os: macos
            arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app dmg
          - os: macos
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app dmg

          # ---- Linux ----
          # Use 22.04 rather than 24.04: Tauri v2 needs webkit2gtk-4.1, which is
          # available from 22.04 with a more stable ABI, so the resulting binaries run
          # on more systems.
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb rpm appimage
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb rpm appimage

    defaults:
      run:
        # src-tauri/Cargo.toml depends on ../../crates/nexapipe-client, i.e. the
        # crates/ directory of this same repository — one checkout provides both.
        working-directory: ui-desktop

    env:
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_ARCH: ${{ matrix.arch }}
      # Both tauri build and tauri signer read these two environment variables directly.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-07-17
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The tag object itself, not just the commit it points at: the tag
          # check tells an annotated tag from a lightweight one.
          fetch-tags: true

      # The signing gate. It runs before anything is built, so a repository
      # without the signing material fails in seconds instead of after a full
      # Rust and frontend build. The material it checks is what the platform
      # needs for the artifact to be signed at all: a Developer ID certificate
      # and the notarization credentials on macOS, an Authenticode certificate
      # on Windows.
      #
      # A missing value is a failure and not a warning: the release would
      # publish an artifact that Gatekeeper or SmartScreen refuses, and the
      # person who installs it is told nothing about why. The failure names
      # the exact values that are missing, the way the Android keystore step
      # does.
      #
      # The one exception is the "allow_unsigned" dispatch input: a platform it
      # lists is published unsigned on purpose. The script says so in the log,
      # and the release notes carry a warning about it.
      #
      # Linux is not gated: a deb/rpm/AppImage carries no code signature in
      # this repository, and Linux refuses nothing the way Gatekeeper and
      # SmartScreen do.
      - name: Check the signing material
        id: gate
        if: matrix.os != 'linux'
        shell: bash
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: .github/scripts/signing-gate.sh "$MATRIX_OS" "$ALLOW_UNSIGNED"

      - name: Prepare the macOS signing credentials
        # The Developer ID certificate and the notarization credentials.
        #
        # Tauri imports the certificate from `APPLE_CERTIFICATE` (a base64
        # .p12) itself and notarizes when the three notarization variables are
        # set, so nothing here touches the keychain.
        #
        # The variables are only handed on when they are all there: Tauri
        # notarizes when it sees them, and half a set is worse than none. The
        # gate above has already refused to start without the whole set, so
        # what arrives here is complete — the check is not repeated.
        #
        # Required, in the repository's secret and variable stores:
        #   secret  APPLE_CERTIFICATE              base64 of the Developer ID .p12
        #   secret  APPLE_CERTIFICATE_PASSWORD     the password of that .p12
        #   secret  APPLE_APP_SPECIFIC_PASSWORD    an app-specific password for notarization
        #   var     APPLE_SIGNING_IDENTITY         "Developer ID Application: … (TEAMID)"
        #   var     APPLE_ID                       the Apple ID email
        #   var     APPLE_TEAM_ID                  the team id
        if: matrix.os == 'macos'
        shell: bash
        env:
          SIGNING_UNSIGNED: ${{ steps.gate.outputs.signing_unsigned }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # An opted-out platform is published unsigned: the certificate is
          # not imported and nothing is notarized, so the bundle is exactly
          # what the release notes say it is.
          if [ "$SIGNING_UNSIGNED" = "true" ]; then
            echo "the macOS bundle is published unsigned (allow_unsigned lists macos): no certificate is imported and nothing is notarized"
            exit 0
          fi
          echo "Signing with: $APPLE_SIGNING_IDENTITY"
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            # The certificate is base64, and base64 wraps at 76 columns, so it
            # is a **multi-line** value. A plain `echo` would write the first
            # line as one env entry and the rest as lines of their own, and
            # the certificate would arrive truncated — which fails the import
            # in a way that says nothing about the password. The heredoc form
            # is the one that carries a multi-line value whole.
            echo "APPLE_CERTIFICATE<<NEXAPIPE_APPLE_CERTIFICATE_EOF"
            echo "$APPLE_CERTIFICATE"
            echo "NEXAPIPE_APPLE_CERTIFICATE_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"
          # The Apple ID is a repository **variable**, so it is not a secret
          # to be kept hidden — but it is an account, and a public job log
          # is the wrong place for one. The log says that notarization is
          # configured and leaves the address out of it.
          echo "Notarizing with the configured Apple ID"
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Prepare the Windows signing certificate
        # The Authenticode certificate, imported into the runner's own
        # certificate store. Tauri signs the NSIS installer and the binaries
        # in it with the certificate whose thumbprint the bundle
        # configuration names, so the certificate has to be in
        # Cert:\CurrentUser\My before the build starts.
        #
        # Required, in the repository's secret and variable stores:
        #   secret  WINDOWS_CERTIFICATE            base64 of the Authenticode .pfx
        #   secret  WINDOWS_CERTIFICATE_PASSWORD   the password of that .pfx
        #
        # The thumbprint is not configured: it is read back from the imported
        # certificate, so it cannot drift away from the certificate that was
        # actually uploaded.
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SIGNING_UNSIGNED: ${{ steps.gate.outputs.signing_unsigned }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          # An opted-out platform is published unsigned: no certificate is
          # imported and nothing is signed, so the installer is exactly what
          # the release notes say it is.
          if ($env:SIGNING_UNSIGNED -eq 'true') {
            Write-Output 'the Windows bundle is published unsigned (allow_unsigned lists windows): no certificate is imported and nothing is signed'
            exit 0
          }

          # The secret is the base64 of the .pfx itself. Whitespace is stripped
          # because base64 wraps at 76 columns, and the file is written to the
          # runner's temp directory and deleted right after the import.
          $base64 = ($env:WINDOWS_CERTIFICATE -replace '\s', '')
          if ([string]::IsNullOrWhiteSpace($base64)) {
            throw 'the secret WINDOWS_CERTIFICATE is empty'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'nexapipe-code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($base64))
          } catch {
            throw "the secret WINDOWS_CERTIFICATE is not valid base64 of a .pfx file: $($_.Exception.Message)"
          }

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          try {
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } catch {
            throw "the .pfx could not be imported into Cert:\CurrentUser\My: $($_.Exception.Message). Check WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD."
          } finally {
            # The private key must not stay on disk in a readable file.
            Remove-Item -Force $pfx -ErrorAction SilentlyContinue
          }
          if (-not $cert.HasPrivateKey) {
            throw 'the imported certificate carries no private key, so nothing can be signed with it'
          }
          Write-Output "imported: $($cert.Subject)"
          Write-Output "thumbprint: $($cert.Thumbprint)"
          Write-Output "expires: $($cert.NotAfter)"
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        shell: bash
        # xdg-utils provides /usr/bin/xdg-open: the AppImage bundler copies it into
        # the image because tauri-plugin-opener enables the shell-open API, and it
        # hard-fails when /usr/bin/xdg-open does not exist ("xdg-open binary not
        # found"). The x64 runner image ships it, the arm64 image does not.
        # Two build-time dependencies only — the app links the libraries that any
        # desktop session already has:
        #   - libdbus-1-dev, what keyring's persistent Linux backend builds
        #     against (Secret Service).
        #   - libpam0g-dev, what the credential door builds against: Linux has no
        #     system prompt of its own to borrow, so it asks PAM.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file \
            rpm \
            xdg-utils \
            libdbus-1-dev \
            libpam0g-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7 @ 2026-10-08
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 @ 2026-08-06
        with:
          # The Rust workspace is under src-tauri/ (its target dir is src-tauri/target).
          cache-on-failure: true
          workspaces: ui-desktop/src-tauri -> target

      - name: Install frontend dependencies
        # npm ci, not npm install: the release must build the tree that is
        # committed and audited, not whatever the registry serves today.
        #
        # The lockfile records every platform's native optional package
        # (@tauri-apps/cli-darwin-arm64, -linux-arm64-gnu, -win32-x64-msvc, and
        # the rest) with its integrity hash and its os/cpu constraints, and npm
        # filters optional dependencies by those constraints at install time —
        # which is what the constraints are for. An older lockfile recorded only
        # the Windows binaries, and npm ci could not find a native binding on the
        # other platforms (npm/cli#4828); that is no longer true of this one.
        #
        # There is deliberately no fallback that re-resolves the tree. A release
        # that installs something other than the committed lockfile is a release
        # nobody reviewed and `npm audit` never saw, so a failure here fails the
        # build instead.
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          # Probe up front rather than blowing up at build time. A failure here
          # means the lockfile and the platform disagree, which is a thing to
          # fix in the lockfile — not something to paper over at build time.
          if ! npx tauri --version >/dev/null 2>&1; then
            echo "::error::the @tauri-apps/cli native binary for this platform is missing after npm ci; the committed package-lock.json does not carry it, so it has to be added there"
            exit 1
          fi
          npx tauri --version

      - name: Check updater signing configuration
        shell: bash
        run: |
          key_set=false; [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && key_set=true
          pass_set=false; [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] && pass_set=true
          echo "TAURI_SIGNING_PRIVATE_KEY set: $key_set"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD set: $pass_set"
          if [ "$key_set" != "$pass_set" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set together or left empty together."
            exit 1
          fi

      - name: Resolve version
        id: meta
        shell: bash
        env:
          # Through the environment rather than into the script text: a value
          # interpolated into a `run:` block is text the shell runs, and a
          # dispatch input is a value somebody typed.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release version: $version"

      # The tag has to name the version this tree builds, and it has to be an
      # annotated tag. Both are failures, not warnings: the desktop version is
      # forced to the tag below, so a tag that does not match the version
      # publishes an app that calls itself one thing while the server it
      # talks to calls itself another.
      #
      # The annotated requirement is the same in every job: a lightweight tag
      # is a bare ref to a commit, and anybody with push access can move it,
      # while the release is signed and published against the tag.
      - name: Verify the release tag
        shell: bash
        # The job's default working directory is ui-desktop; the workspace
        # version lives in the Cargo.toml of the repository root.
        working-directory: ${{ github.workspace }}
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid v<major>.<minor>.<patch>"
            exit 1
          fi

          WORKSPACE_VERSION="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{line=$0; sub(/^[^=]*=[[:space:]]*/,"",line); gsub(/["[:space:]]/,"",line); print line; exit}' Cargo.toml)"
          if [ -z "$WORKSPACE_VERSION" ]; then
            echo "::error::could not read the workspace version out of Cargo.toml"
            exit 1
          fi
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match the workspace version ${WORKSPACE_VERSION} in Cargo.toml: this release would carry binaries that report a different version"
            exit 1
          fi

          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || echo missing)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::the tag ${TAG} is not an annotated tag (git says '${TAG_TYPE}'): a lightweight tag is a bare ref that anybody with push access can move, and the release is published and signed against the tag. Create it with 'git tag -a ${TAG} -m \"...\"'."
            exit 1
          fi

          echo "tag ${TAG} is an annotated tag and matches the workspace version ${WORKSPACE_VERSION}"

      - name: Sync version into tauri.conf.json
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          node -e "console.log('tauri.conf.json version =', JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)"

      - name: Generate Tauri CI config override
        # Generates ci-override.json, which overrides tauri.conf.json per platform/arch:
        #   - bundle.resources: on Windows pick wintun.dll by target arch (arm64 must
        #     not ship the amd64 DLL)
        #   - bundle.createUpdaterArtifacts: enabled only when a signing key exists,
        #     otherwise the build fails for lack of a signature
        #   - bundle.windows.certificateThumbprint: the Authenticode certificate the
        #     Windows bundle is signed with, read back from the certificate the
        #     "Prepare the Windows signing certificate" step imported
        #   - build.beforeBuildCommand: always npm, so we do not depend on yarn being
        #     present on the runner
        shell: bash
        env:
          SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: node .github/scripts/ci-config.mjs

      - name: Build bundle
        shell: bash
        run: |
          npx tauri build \
            --bundles ${{ matrix.bundles }} \
            --target ${{ matrix.target }} \
            --config ci-override.json

      - name: Report what the macOS bundle is
        # What the bundle actually is, rather than what was asked for: the
        # signature and the notarization are the two things a user's Gatekeeper
        # asks about, and a bundle that is signed but not notarized is refused
        # just as firmly as one that is neither.
        #
        # So this step does not only report: when the release is supposed to
        # be signed, a bundle that is not signed with a Developer ID
        # certificate fails the job, because that is the artifact the Release
        # would publish. A run that opted out of signing reports the same
        # findings without enforcing them.
        if: matrix.os == 'macos'
        shell: bash
        env:
          SIGNING_UNSIGNED: ${{ steps.gate.outputs.signing_unsigned }}
        run: |
          set -uo pipefail
          enforce=true
          if [ "$SIGNING_UNSIGNED" = "true" ]; then
            enforce=false
            echo "::warning::this bundle is published unsigned (allow_unsigned lists macos): the findings below are reported, not enforced"
          fi
          failed=0
          # src-tauri/target/<triple>/release/bundle/macos/<name>.app
          APP=$(find src-tauri/target -maxdepth 6 -name '*.app' -type d 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::no .app was found to report the signature of"
            failed=1
          else
            if codesign --verify --deep --strict --verbose=2 "$APP" 2>&1; then
              echo "the signature verifies"
            else
              echo "::error::$APP does not carry a valid signature"
              failed=1
            fi
            # `codesign --verify` passes for an **ad-hoc** signature as well, so
            # it says nothing about whose signature it is. The authority is what
            # tells a Developer ID signature from an ad-hoc one, and only the
            # first is the one a user's Gatekeeper accepts.
            if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "Authority=Developer ID"; then
              echo "the signature is a Developer ID one"
            else
              echo "::error::$APP is not signed with a Developer ID certificate, so Gatekeeper will refuse it"
              failed=1
            fi
            if spctl --assess --type execute --verbose=2 "$APP" 2>&1; then
              echo "Gatekeeper accepts the bundle"
            else
              echo "::error::Gatekeeper does not accept $APP. It is either unsigned or not notarized, and macOS will refuse to open it until the user allows it by hand."
              failed=1
            fi
          fi
          # The published artifact is the **disk image**, not the application
          # inside it: the image is what a user downloads, and the quarantine
          # attribute lands on the image. The application is assessed above
          # because that is what carries the signature.
          #
          # The image itself carries no stapled ticket — the bundler notarizes
          # the application and signs the image — so this one is reported and
          # not enforced.
          DMG=$(find src-tauri/target -maxdepth 6 -name '*.dmg' -type f 2>/dev/null | head -n 1)
          if [ -n "$DMG" ]; then
            if spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG" 2>&1; then
              echo "Gatekeeper accepts the disk image $DMG"
            else
              echo "::warning::Gatekeeper does not accept $DMG, which is the artifact the release publishes."
            fi
          else
            echo "::warning::no .dmg was found to assess, and the .dmg is the artifact the release publishes"
          fi
          if [ "$failed" -ne 0 ] && [ "$enforce" = true ]; then
            echo "::error::the macOS bundle is not signed with a Developer ID certificate, so this release would publish an artifact Gatekeeper refuses"
            exit 1
          fi
          exit 0

      - name: Verify the Windows installer signature
        # The counterpart of the macOS check above, for the artifact the user
        # downloads on Windows: the NSIS installer. A bundle that carries no
        # Authenticode signature fails the job, because SmartScreen refuses
        # it and says nothing about why.
        #
        # The signature has to be the one that was imported above; a bundle
        # signed with some other certificate is not the release either.
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          SIGNING_UNSIGNED: ${{ steps.gate.outputs.signing_unsigned }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_UNSIGNED -eq 'true') {
            Write-Output 'the Windows installer is published unsigned (allow_unsigned lists windows): the signature is reported, not enforced'
            exit 0
          }

          $installers = @(Get-ChildItem -Path 'src-tauri/target' -Recurse -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            throw 'no NSIS installer was produced, so there is nothing to verify'
          }

          $failed = $false
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if (-not $signature.SignerCertificate) {
              Write-Output "::error::$($installer.Name) carries no Authenticode signature, so SmartScreen will refuse it"
              $failed = $true
              continue
            }
            Write-Output "$($installer.Name): signed by $($signature.SignerCertificate.Subject) (status $($signature.Status))"
            if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -and $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              Write-Output "::error::$($installer.Name) is signed with $($signature.SignerCertificate.Thumbprint), which is not the certificate that was imported ($($env:WINDOWS_CERTIFICATE_THUMBPRINT))"
              $failed = $true
            }
            if ($signature.Status -ne 'Valid') {
              # The file is signed, but the certificate does not chain to a
              # trusted root — a self-signed test certificate, say. SmartScreen
              # warns about that too, but the artifact is signed, so this is
              # reported rather than enforced.
              Write-Output "::warning::the signature of $($installer.Name) does not validate against a trusted root (status $($signature.Status)); SmartScreen will warn the user about it"
            }
          }
          if ($failed) {
            throw 'the Windows installer is not signed with the configured certificate'
          }

      - name: Verify Debian service upgrade packaging
        if: matrix.os == 'linux'
        shell: bash
        run: .github/scripts/verify-deb.sh

      - name: Stage build artifacts
        id: stage
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_DIR: src-tauri/target
          MATRIX_TARGET: ${{ matrix.target }}
        run: node .github/scripts/stage-artifact.mjs

      - name: Re-sign renamed artifacts
        # stage-artifact.mjs renames every bundle to <product>-<version>-<os>-<arch>
        # (Tauri's macOS updater bundle carries no arch at all, and the deb/rpm/NSIS
        # names mix `_` and `-`). A minisign signature is bound to the file it was made
        # for, so each renamed artifact that has a .sig is signed again here — on
        # macOS the updater payload, on Windows both the NSIS installer and its
        # updater .zip, on Linux the AppImage update archive.
        if: steps.stage.outputs.resign_files != ''
        shell: bash
        env:
          RESIGN_FILES: ${{ steps.stage.outputs.resign_files }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rm -f "release-artifact/$f.sig"
            npx tauri signer sign --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "release-artifact/$f"
            test -f "release-artifact/$f.sig"
            echo "re-signed: $f"
          done <<< "$RESIGN_FILES"

      - name: Generate updater manifest
        # TAG_NAME overrides GITHUB_REF_NAME so a workflow_dispatch re-run of an
        # existing tag still builds asset URLs pointing at the tag, not the branch.
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          UPDATER_FILE: ${{ steps.stage.outputs.updater_file }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: node .github/scripts/latest-json.mjs

      - name: Show staged release files
        shell: bash
        run: |
          find release-artifact -type f | sort

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-07
        with:
          name: dist-desktop-${{ matrix.os }}-${{ matrix.arch }}
          # upload-artifact paths are relative to the workspace root and ignore defaults.run.
          path: ui-desktop/release-artifact/**
          if-no-files-found: error
          retention-days: 7

      - name: Retry upload on transient blob-storage failure
        # The initial upload can fail with "Unable to make request: ETIMEDOUT" against
        # Azure blob storage (hit macos-15-intel once, mid-upload, other 5 jobs fine).
        # overwrite: true lets this second attempt replace any partially created artifact.
        # Guarded with hashFiles so it stays a no-op when the failure happened before
        # anything was staged (e.g. the build itself failed).
        if: failure() && hashFiles('ui-desktop/release-artifact/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-07
        with:
          name: dist-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: ui-desktop/release-artifact/**
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # ----------------------------------------------------------------------
  # Android APK (migrated from open-nexa/nexa-android). The .so is built from
  # this same checkout (crates/nexapipe-client) with cargo-ndk — no more
  # floating-main clone of the server repo.
  #
  # Required secrets (Settings -> Secrets and variables -> Actions)
  #   RELEASE_KEYSTORE_BASE64    base64 of the *.jks keystore itself (one line)
  #   RELEASE_KEYSTORE_PASSWORD  keystore password
  #   RELEASE_KEY_ALIAS          key alias
  #   RELEASE_KEY_PASSWORD       key password
  # ----------------------------------------------------------------------
  build-apk:
    name: android apk${{ inputs.signing_only == true && ' (signing check only)' || '' }}
    # There is no signing_only gate on this job: the Android keystore check
    # lives in it, so a signing_only run has to reach it. Every build step
    # below is guarded by the "skip_rust" output of "Resolve build inputs", so
    # that mode runs the keystore step and nothing else — no Android SDK, no
    # NDK, no Rust, no Gradle, no APK.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The publishing jobs run in an environment, so the repository can put
    # an approval rule in front of them: a job that runs the tagged tree's
    # own code while holding the signing keys, the release keystore and
    # write access to the package registry is a job that deserves a second
    # pair of eyes. The environment is created by the first run that uses
    # it; the rules are the repository's to set.
    environment: release
    outputs:
      skip_rust: ${{ steps.opts.outputs.skip_rust }}

    env:
      NDK_VERSION: 29.0.14206865
      MIN_SDK: 26
      # One APK per ABI (see the splits block in ui-android/app/build.gradle.kts).
      # x86_64 is the emulator ABI; arm64-v8a is what phones run. Each needs its
      # own .so built from the same crate, so both are listed as "abi:triple".
      ANDROID_ABI_PAIRS: arm64-v8a:aarch64-linux-android x86_64:x86_64-linux-android
      # compileSdk 37 (Compose 1.12 requires it); note the platform package is
      # named android-37.0 — plain "android-37" no longer exists upstream.
      ANDROID_PLATFORM: '37.0'
      BUILD_TOOLS: 37.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-07-17
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The tag object itself, not just the commit it points at: the tag
          # check tells an annotated tag from a lightweight one.
          fetch-tags: true

      - name: Resolve build inputs
        id: opts
        env:
          INPUT_SIGNING_ONLY: ${{ inputs.signing_only }}
          # Through the environment rather than into the script text: a value
          # interpolated into a `run:` block is text the shell runs, and a
          # dispatch input is a value somebody typed.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Inputs are empty on tag-push runs, so the full flow runs by default.
          if [ "${INPUT_SIGNING_ONLY:-false}" = "true" ]; then
            SKIP_RUST=true
          else
            SKIP_RUST=false
          fi

          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION_NAME="${TAG#v}"

          # A version with a hyphen (v0.2.0-rc.1 / -beta.1 / -alpha.3) is a
          # pre-release; a plain version (v1.0.0) is not. Same rule everywhere,
          # so a release-candidate tag never replaces "latest".
          if [[ "$VERSION_NAME" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "prerelease=$PRERELEASE"
            echo "skip_rust=$SKIP_RUST"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### nexapipe $VERSION_NAME (versionCode ${GITHUB_RUN_NUMBER})"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| ABIs | \`${ANDROID_ABI_PAIRS}\` |"
            echo "| Pre-release | \`${PRERELEASE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The tag has to name the version this tree builds, and it has to be an
      # annotated tag. Both are failures, not warnings: the APK's versionName
      # comes from the tag, so a tag that does not match the version ships an
      # app that calls itself one thing while the server it talks to calls
      # itself another.
      #
      # The annotated requirement is the same in every job: a lightweight tag
      # is a bare ref to a commit, and anybody with push access can move it,
      # while the release is signed and published against the tag.
      #
      # A signing_only run is about the keystore, not about the tag, so the
      # check waits for a run that actually builds.
      - name: Verify the release tag
        if: steps.opts.outputs.skip_rust != 'true'
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not a valid v<major>.<minor>.<patch>"
            exit 1
          fi

          WORKSPACE_VERSION="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{line=$0; sub(/^[^=]*=[[:space:]]*/,"",line); gsub(/["[:space:]]/,"",line); print line; exit}' Cargo.toml)"
          if [ -z "$WORKSPACE_VERSION" ]; then
            echo "::error::could not read the workspace version out of Cargo.toml"
            exit 1
          fi
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::tag ${TAG} does not match the workspace version ${WORKSPACE_VERSION} in Cargo.toml: this release would carry binaries that report a different version"
            exit 1
          fi

          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || echo missing)"
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::the tag ${TAG} is not an annotated tag (git says '${TAG_TYPE}'): a lightweight tag is a bare ref that anybody with push access can move, and the release is published and signed against the tag. Create it with 'git tag -a ${TAG} -m \"...\"'."
            exit 1
          fi

          echo "tag ${TAG} is an annotated tag and matches the workspace version ${WORKSPACE_VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6 @ 2026-10-14
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # android-actions/setup-android is deliberately NOT used here. Its
      # `packages` input defaults to "tools platform-tools" and the legacy
      # "tools" package has been removed from the SDK repository, so the action
      # dies with "Failed to find package 'tools'" on current runner images
      # (cmdline-tools 16.0). The GitHub-hosted Ubuntu image already ships a
      # working SDK + cmdline-tools, so the handful of packages this build
      # needs are installed explicitly below -- and never "tools".
      - name: Set up Android SDK
        id: sdk
        if: steps.opts.outputs.skip_rust != 'true'
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK root: $SDK"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "${SM:-}" ] || [ ! -x "$SM" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            ls -1 "$SDK/cmdline-tools" || true
            exit 1
          fi
          echo "sdkmanager: $SM"

          # Accept the licenses before installing anything.
          yes | "$SM" --licenses > /dev/null 2>&1 || true

          "$SM" --install \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}"

          # Install the pinned NDK. If that exact build is no longer in the
          # channel, take the newest available one instead of failing the whole
          # release -- any NDK >= r26 works for arm64-v8a / minSdk 26.
          if ! "$SM" --install "ndk;${NDK_VERSION}"; then
            LATEST_NDK=$("$SM" --list 2>/dev/null \
              | awk -v skip="ndk;${NDK_VERSION}" \
                    '/^[[:space:]]*ndk;/{ if ($1 != skip) { v=$1 } } END{ print v }')
            if [ -n "${LATEST_NDK:-}" ]; then
              echo "::warning::ndk;${NDK_VERSION} is unavailable, falling back to ${LATEST_NDK}"
              "$SM" --install "$LATEST_NDK" \
                || echo "::warning::${LATEST_NDK} could not be installed either"
            else
              echo "::warning::ndk;${NDK_VERSION} is unavailable and no alternative NDK is listed by the SDK channel"
            fi
          fi

          NDK_DIR="$SDK/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -1d "$SDK"/ndk/*/ 2>/dev/null | sort -V | tail -n 1 | sed 's:/$::' || true)
          fi
          if [ -z "${NDK_DIR:-}" ] || [ ! -d "$NDK_DIR" ]; then
            echo "::error::No NDK directory under $SDK/ndk"
            ls -1 "$SDK/ndk" || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ndk_version=$(basename "$NDK_DIR")" >> "$GITHUB_OUTPUT"
          echo "NDK: $NDK_DIR"

      - name: Set up Rust toolchain
        if: steps.opts.outputs.skip_rust != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        if: steps.opts.outputs.skip_rust != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2 @ 2026-10-16
        with:
          # The same version the CI workflow pins. This job holds the signing
          # keys, so the tool that builds what gets signed is not the one that
          # can change under it without a change in this file.
          tool: cargo-ndk@4.1.2

      - name: Cache cargo artifacts
        if: steps.opts.outputs.skip_rust != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 @ 2026-06-23
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Both Android triples share one cache entry: each build below pulls
          # the other's artifacts forward, and a per-triple key would compile
          # the whole dependency tree twice.
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # The .so is built straight from this repository's crates/nexapipe-client
      # and copied into the app's jniLibs (which app/.gitignore excludes).
      - name: Build libnexapipe_client.so
        if: steps.opts.outputs.skip_rust != 'true'
        run: |
          set -euo pipefail
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # One .so per shipped ABI, each from the same crate. The app packages
          # one APK per ABI (build.gradle.kts splits), so a missing .so is not a
          # build failure here — it is an APK that dies with UnsatisfiedLinkError
          # on the device. Both are therefore built and both are checked below.
          for PAIR in ${ANDROID_ABI_PAIRS}; do
            ABI="${PAIR%%:*}"
            TRIPLE="${PAIR##*:}"
            LINKER="${NDK_BIN}/${TRIPLE}${MIN_SDK}-clang"
            if [ ! -x "$LINKER" ]; then
              echo "::error::NDK linker not found: $LINKER"
              ls -1 "$NDK_BIN" | grep -E 'clang$' || true
              exit 1
            fi

            # The repo .cargo/config.toml hardcodes a Windows NDK linker path.
            # Override it on the command line with --config (which takes
            # precedence over both environment variables and the config file) so
            # the Linux runner uses the right clang.
            cargo ndk \
              --target "${ABI}" \
              --platform "${MIN_SDK}" \
              build --release \
              -p nexapipe-client \
              --features "jni local-proxy tun-proxy" \
              --config "target.${TRIPLE}.linker='${LINKER}'"

            mkdir -p "ui-android/app/src/main/jniLibs/${ABI}"
            cp "target/${TRIPLE}/release/libnexapipe_client.so" \
               "ui-android/app/src/main/jniLibs/${ABI}/libnexapipe_client.so"
            ls -lh "ui-android/app/src/main/jniLibs/${ABI}/libnexapipe_client.so"
          done

      - name: Verify native library exports
        if: steps.opts.outputs.skip_rust != 'true'
        run: |
          set -euo pipefail
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          for PAIR in ${ANDROID_ABI_PAIRS}; do
            ABI="${PAIR%%:*}"
            SO="ui-android/app/src/main/jniLibs/${ABI}/libnexapipe_client.so"
            test -f "$SO" || { echo "::error file=$SO::Native library not found"; exit 1; }
            SYMS=$("$NM" -D --defined-only "$SO" \
                   | grep -o 'Java_com_nexa_pipe_IrohProxy_[A-Za-z0-9_]*' | sort -u || true)
            echo "$SYMS"

            MISSING=0
            for FN in nativeInit nativeSetDnsServers nativeSetDnsOverride nativeSetRelayConfig \
                      nativeSetTwoFactor nativeStartIroh nativeStartProxy nativePreconnect \
                      nativeStopProxy nativeAddNode nativeStartTunProxy \
                      nativeStopTunProxy nativeDestroy; do
              if ! echo "$SYMS" | grep -qx "Java_com_nexa_pipe_IrohProxy_${FN}"; then
                echo "::error::${SO} is missing the JNI symbol ${FN} (check that the cargo features include tun-proxy)"
                MISSING=1
              fi
            done
            [ "$MISSING" -eq 0 ] || exit 1
          done

      # Restore RELEASE_KEYSTORE_BASE64 into a .jks file and surface every
      # problem (wrong secret content / wrong password / wrong alias) right
      # here. Otherwise the failure is deferred to the Gradle packaging step and
      # reported as KeytoolException / toDerInputStream rejects tag type NNN,
      # which is very hard to trace back.
      - name: Prepare signing keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          die() { echo "::error::$1"; exit 1; }

          [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] \
            || die "Missing secret RELEASE_KEYSTORE_BASE64 (base64 of the *.jks keystore itself)"

          # All four values are required. AGP silently drops a signing config
          # that is missing any of them and the build then fails at
          # :app:validateSigningRelease with "Keystore file not set for signing
          # config release", which does not name the value that is actually
          # missing. Report the gap here instead.
          [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] \
            || die "Missing secret RELEASE_KEYSTORE_PASSWORD (keystore password)"
          [ -n "${RELEASE_KEY_ALIAS:-}" ] \
            || die "Missing secret RELEASE_KEY_ALIAS (key alias; scripts/verify-signing-secrets.ps1 defaults to 'nexapipe')"
          [ -n "${RELEASE_KEY_PASSWORD:-}" ] \
            || die "Missing secret RELEASE_KEY_PASSWORD (password of the key itself)"

          # Tolerate whitespace, newlines, quotes, backticks and a data URI
          # prefix that may have been picked up while pasting.
          B64=$(printf '%s' "$RELEASE_KEYSTORE_BASE64" \
                | tr -d "[:space:]" \
                | tr -d "\"\`'" \
                | sed 's/^data:[^,]*;base64,//')
          [ -n "$B64" ] || die "Secret RELEASE_KEYSTORE_BASE64 is empty after stripping whitespace"
          echo "Secret character count: ${#RELEASE_KEYSTORE_BASE64} (${#B64} after stripping whitespace)"

          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.jks"

          # If plain decoding fails, retry once while tolerating stray invalid
          # characters and let the file-header check below be the final guard.
          if ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null; then
            printf '%s' "$B64" | base64 -d -i > "$KS" 2>/dev/null \
              || die "RELEASE_KEYSTORE_BASE64 is not valid base64 (length after cleanup: ${#B64})"
          fi

          SIZE=$(stat -c %s "$KS")
          MAGIC=$(od -A n -t x1 -N 4 "$KS" | tr -d ' \n')
          SHA=$(sha256sum "$KS" | cut -d ' ' -f1)
          echo "Decoded ${SIZE} bytes, file header 0x${MAGIC}, sha256 ${SHA}"

          case "$MAGIC" in
            3082*|30*) ;;      # PKCS12 (DER SEQUENCE)
            feedfeed) ;;       # legacy JKS
            *)
              echo "::error::RELEASE_KEYSTORE_BASE64 does not decode to a keystore (file header 0x${MAGIC}, expected 0x3082... or 0xfeedfeed)"
              echo "---------- First 32 decoded bytes ----------"
              od -A d -t x1z -N 32 "$KS" || true
              echo "--------------------------------------"
              echo "This secret must be the base64 of the *.jks file ITSELF: a single line, a few thousand characters, starting with MII."
              echo "Common mistakes: a file path / the password / the path of the base64 file / the base64 of some other file."
              echo "If the character/byte count above looks far too small (this project's keystore is about 4.3 KB, i.e. about 5776 base64 characters),"
              echo "it was almost certainly truncated while copying the single long line. Copy the whole thing with this command instead of selecting it by hand:"
              echo "  Get-Content <base64-file> -Raw | Set-Clipboard"
              exit 1
              ;;
          esac
          [ "$SIZE" -gt 1000 ] || die "The decoded keystore is only ${SIZE} bytes, obviously incomplete"

          # Validate the password and the alias with keytool up front; that is
          # far quicker than waiting for the Gradle packaging step to fail.
          if ! keytool -list -keystore "$KS" \
                 -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" \
                 > /dev/null 2> "$RUNNER_TEMP/keytool.err"; then
            cat "$RUNNER_TEMP/keytool.err"
            echo "Private key entries in this keystore (use one of these as RELEASE_KEY_ALIAS):"
            keytool -list -keystore "$KS" -storepass "$RELEASE_KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -i "PrivateKeyEntry" || echo "  (none listed)"
            die "keytool cannot read alias '${RELEASE_KEY_ALIAS}': check RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD / RELEASE_KEYSTORE_PASSWORD"
          fi
          echo "keytool check passed: password and alias ${RELEASE_KEY_ALIAS} are both correct"

          {
            echo ""
            echo "### Signing keystore verification"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Size | ${SIZE} bytes |"
            echo "| File header | \`0x${MAGIC}\` |"
            echo "| sha256 | \`${SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "keystore_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "RELEASE_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Signing check only
        if: steps.opts.outputs.skip_rust == 'true'
        run: |
          set -euo pipefail
          echo "signing_only=true: the Android keystore check passed; no APK was built and nothing was published."
          echo "The desktop signing material is checked by the 'signing material' job of the same run."
          echo "keystore sha256: ${{ steps.keystore.outputs.keystore_sha256 }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble signed release APK
        if: steps.opts.outputs.skip_rust != 'true'
        working-directory: ui-android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PversionName="${{ steps.opts.outputs.version_name }}" \
            -PversionCode="${{ steps.opts.outputs.version_code }}"

      - name: Verify APK signature and stage artifact
        id: apk
        if: steps.opts.outputs.skip_rust != 'true'
        working-directory: ui-android
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n 1)

          # One APK per ABI. The name the file already carries is the only
          # reliable record of which one it is, so the staging step refuses
          # anything it does not recognise rather than shipping it as "the" APK.
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | sort)
          [ "${#APKS[@]}" -eq 2 ] || {
            echo "::error::expected exactly 2 ABI APKs, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          }

          for APK in "${APKS[@]}"; do
            "${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$APK"

            case "$APK" in
              *arm64-v8a*) ABI_SUFFIX=arm64 ;;
              *x86_64*)    ABI_SUFFIX=x86_64 ;;
              *) echo "::error::unrecognised APK name: $APK"; exit 1 ;;
            esac

            # <product>-<version>-<platform>, the same rule as the desktop bundles
            # (productName "nexa" -> nexa-0.2.0-macos-aarch64.dmg). The GUI keeps its own
            # product name; only the server archives are "nexapipe-" prefixed, so one
            # Release never carries two names for one product.
            OUT="nexa-${{ steps.opts.outputs.version_name }}-android-${ABI_SUFFIX}.apk"
            cp "$APK" "$OUT"
            sha256sum "$OUT" > "${OUT}.sha256"

            {
              echo "### Artifacts"
              echo '```'
              "${BUILD_TOOLS_DIR}/aapt2" dump badging "$OUT" | head -n 4
              cat "${OUT}.sha256"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload APK artifact
        if: steps.opts.outputs.skip_rust != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-07
        with:
          name: dist-apk
          path: |
            ui-android/nexa-${{ steps.opts.outputs.version_name }}-android-arm64.apk
            ui-android/nexa-${{ steps.opts.outputs.version_name }}-android-arm64.apk.sha256
            ui-android/nexa-${{ steps.opts.outputs.version_name }}-android-x86_64.apk
            ui-android/nexa-${{ steps.opts.outputs.version_name }}-android-x86_64.apk.sha256
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # The signing-only check.
  #
  # A dispatch run with "signing_only" answers one question: are the signing
  # secrets in place? The Android half of that answer is the "Prepare signing
  # keystore" step of the build-apk job above, which runs in this mode too;
  # this job is the desktop half.
  #
  # It checks the material a desktop bundle needs to be signed at all: the
  # Developer ID certificate and the notarization credentials on macOS, the
  # Authenticode certificate on Windows. It runs the same gate script the
  # release path uses, so the check and the release agree on what "signed"
  # means, and there is one gate rather than two.
  #
  # A missing value fails the job and names the value. A release that
  # publishes an unsigned artifact is refused by the operating system of the
  # person who installs it, and nobody is told why.
  #
  # The one exception is the "allow_unsigned" input: a platform it lists is
  # reported as the platform that would be published unsigned, and the run
  # does not fail on it.
  # ----------------------------------------------------------------------
  signing-check:
    name: signing material
    if: ${{ inputs.signing_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-07-17
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the desktop signing material
        shell: bash
        env:
          # The same list the release path uses. A platform it names is
          # reported as the one that would be published unsigned instead of
          # failing the run.
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -uo pipefail
          GATE="ui-desktop/.github/scripts/signing-gate.sh"
          if [ ! -f "$GATE" ]; then
            echo "::error::the checkout has no $GATE: the tag that was dispatched does not carry the signing gate. Dispatch the run with a tag that has it."
            exit 1
          fi

          failed=0
          unsigned_any=false
          {
            echo ""
            echo "### Desktop signing material"
            echo ""
            echo "| Platform | State |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for platform in macos windows; do
            echo "--- $platform ---"
            LOG="$RUNNER_TEMP/gate-$platform.txt"
            # pipefail, so the gate's own exit code is the pipeline's: a
            # missing value fails the loop, not just the log.
            if "$GATE" "$platform" "${ALLOW_UNSIGNED:-}" | tee "$LOG"; then
              ready=$(grep -m1 '^SIGNING_READY=' "$LOG" | cut -d= -f2)
              unsigned=$(grep -m1 '^SIGNING_UNSIGNED=' "$LOG" | cut -d= -f2)
            else
              failed=1
              ready=false
              unsigned=false
            fi

            if ! grep -q '^SIGNING_READY=' "$LOG"; then
              state="the gate did not finish — see the log above"
            elif [ "$ready" = "true" ]; then
              state="the material is complete — this platform is signed"
            elif [ "$unsigned" = "true" ]; then
              unsigned_any=true
              state="the material is incomplete, and allow_unsigned lists this platform: it would be published unsigned"
            else
              state="the material is incomplete: this platform cannot be published signed"
            fi
            echo "| $platform | $state |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::the desktop signing material is incomplete: the values named above have to be in the repository's secret and variable stores before a release can publish a signed artifact"
            exit 1
          fi
          if [ "$unsigned_any" = "true" ]; then
            echo "the desktop signing material is in place for every platform that is published signed; the platform that allow_unsigned lists would be published unsigned"
            exit 0
          fi
          echo "the desktop signing material is in place"

  # ----------------------------------------------------------------------
  # Container image: ghcr.io/open-nexa/nexapipe.
  #
  # One leg per architecture, each on a runner whose CPU is the platform it
  # builds, so neither leg needs QEMU: Dockerfile compiles for the machine it
  # runs on, and emulating a full cargo build (iroh is a large dependency tree)
  # costs more wall clock than the arm64 runner it would save.
  #
  # Dockerfile-aarch64 is deliberately unused. Its builder stage has no
  # `FROM --platform=$BUILDPLATFORM` pin, so buildx resolves it to arm64 and
  # runs the aarch64 cross-compilation under emulation anyway — the opposite of
  # what a cross-compiling Dockerfile is for — and its runtime stage pulls
  # alpine from a self-hosted mirror (registry.it.iakl.top) that a hosted
  # runner has no route to.
  #
  # A single buildx build cannot span two runners, so each leg pushes only its
  # own digest and publish-image merges them into one manifest list afterwards.
  # ----------------------------------------------------------------------
  build-image:
    name: image ${{ matrix.arch }}
    if: ${{ inputs.signing_only != true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # The publishing jobs run in an environment, so the repository can put
    # an approval rule in front of them: a job that runs the tagged tree's
    # own code while holding the signing keys, the release keystore and
    # write access to the package registry is a job that deserves a second
    # pair of eyes. The environment is created by the first run that uses
    # it; the rules are the repository's to set.
    environment: release
    # The GHCR push. Elevated here and not in the workflow-level block, which
    # stays read-only for the whole build stage.
    permissions:
      contents: read
      packages: write
    strategy:
      # One architecture failing should not hide the other's failure
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Native arm64 runner, as the arm64 desktop bundle uses: Dockerfile
            # builds for the host triple, so an arm64 image needs an arm64 CPU.
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-07-17
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 @ 2025-12-16
        with:
          version: v0.38.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 @ 2026-01-27
        with:
          registry: ghcr.io
          # GITHUB_TOKEN can push to the repository's own package, so publishing
          # needs no secret of its own.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 @ 2026-02-12
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # Untagged on purpose: the tags are decided once in publish-image,
          # when both architectures are known to have built. A release whose
          # arm64 leg failed must not leave an amd64-only image under the
          # version tag.
          #
          # No buildx attestation here on purpose. With one enabled, buildx
          # pushes an index — the image plus its attestation — rather than the
          # image alone, and the digest below would be that index's, which
          # publish-image would then have to flatten again. This is not the
          # action's default: docker/build-push-action adds `mode=max`
          # provenance by itself for a public repository (and `mode=min,
          # inline-only` for a private one), so `provenance: false` is set
          # explicitly here — as it is in the CI build-only job — to keep each
          # leg a plain image. The provenance that matters is attached to the
          # published manifest list instead, in publish-image, where the thing
          # a user pulls is the thing that is attested.
          outputs: type=image,name=ghcr.io/open-nexa/nexapipe,push-by-digest=true,push=true
          provenance: false

      # The digest is the only handle this leg's image has. It goes through an
      # artifact because a matrix job's outputs would only survive for one of
      # the two legs.
      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-07
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # The tag that turns the two digests into one multi-arch image. "latest" is
  # applied with the same pre-release rule as the GitHub release and the APK:
  # a version carrying a hyphen (v0.5.0-rc.1) gets the version tag and nothing
  # else, so a release candidate cannot take "latest" away from a stable one.
  # ----------------------------------------------------------------------
  publish-image:
    name: publish image
    needs: [build-image]
    if: ${{ inputs.signing_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The digest of the published manifest list, for the release job: it puts
    # it in the release notes and moves the "latest" tag onto it.
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    # The publishing jobs run in an environment, so the repository can put
    # an approval rule in front of them: a job that runs the tagged tree's
    # own code while holding the signing keys, the release keystore and
    # write access to the package registry is a job that deserves a second
    # pair of eyes. The environment is created by the first run that uses
    # it; the rules are the repository's to set.
    environment: release
    # Same elevation as build-image: imagetools writes the manifest list to GHCR
    permissions:
      contents: read
      packages: write
      # The signing key is minted for this run rather than stored: the OIDC
      # token is what binds the signature to this workflow and this ref.
      id-token: write
      # The provenance attestation is written to GitHub's attestation store.
      attestations: write
    steps:
      - name: Resolve version
        shell: bash
        env:
          # Through the environment rather than into the script text: a value
          # interpolated into a `run:` block is text the shell runs, and a
          # dispatch input is a value somebody typed.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 @ 2025-12-16
        with:
          version: v0.38.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 @ 2026-01-27
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 @ 2026-10-07
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - name: Create manifest list
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          # The version tag only. The "latest" tag is moved by the release
          # job, once the GitHub Release exists: a user who pulls "latest"
          # has to find the release that carries the server binaries of the
          # same version, and a release that does not exist yet has none.
          #
          # The tag is applied to the manifest list that is created here, in
          # one command, so "latest" and the version tag resolve to the same
          # digest — and that digest is the one cosign signs below.
          tags=("ghcr.io/open-nexa/nexapipe:${VERSION}")

          sources=()
          for f in /tmp/digests/*; do
            sources+=("ghcr.io/open-nexa/nexapipe@sha256:$(basename "$f")")
          done
          # Two legs in, two digests out: a manifest list built from one of them
          # is a single-arch image wearing a multi-arch name.
          [ "${#sources[@]}" -eq 2 ] || {
            echo "::error::expected 2 platform digests, got ${#sources[@]}"
            ls -l /tmp/digests
            exit 1
          }

          tag_args=()
          for t in "${tags[@]}"; do
            tag_args+=(--tag "$t")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "ghcr.io/open-nexa/nexapipe:${VERSION}"

          # The digest of the list that was just published. This is the handle
          # a user pulls, and the one the signature and the provenance
          # attestation below are bound to: the per-architecture digests are
          # not what `docker pull ghcr.io/open-nexa/nexapipe:1.0.0` resolves to.
          digest="$(docker buildx imagetools inspect "ghcr.io/open-nexa/nexapipe:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::could not read the published digest"
            exit 1
          fi
          echo "Published ghcr.io/open-nexa/nexapipe@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The signature is made with the workflow's own identity rather than a
      # key that sits in a secret: the OIDC token below is minted for this
      # run, and the certificate says which workflow, which repository and
      # which ref it was minted for. A key in a secret could be copied; a
      # token cannot.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3 @ 2025-06-23

      - name: Sign the published image
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          # The signature travels with the image as an OCI referrer, so
          # `cosign verify ghcr.io/open-nexa/nexapipe@<digest>` is what a
          # reader runs. The certificate identity is the workflow, not a
          # person: see the verification snippet in the README.
          cosign sign --yes "ghcr.io/open-nexa/nexapipe@${DIGEST}"

      # The provenance attestation says what was built and from which source
      # revision, in the form GitHub's own attestation store keeps. It is
      # pushed to the registry next to the image, so it is found by digest.
      - name: Attest the provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2 @ 2025-06-11
        with:
          subject-name: ghcr.io/open-nexa/nexapipe
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  release:
    name: publish release
    # publish-image is a need as well: the image is pushed by digest and then
    # signed, so a failed signature or attestation has to keep the GitHub
    # Release from being created over an unsigned image. A signing_only run
    # skips both jobs anyway.
    needs: [build, build-desktop, build-apk, publish-image]
    # A signing_only dispatch run uploads nothing to publish.
    if: ${{ inputs.signing_only != true && needs.build-apk.outputs.skip_rust != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The publishing jobs run in an environment, so the repository can put
    # an approval rule in front of them: a job that runs the tagged tree's
    # own code while holding the signing keys, the release keystore and
    # write access to the package registry is a job that deserves a second
    # pair of eyes. The environment is created by the first run that uses
    # it; the rules are the repository's to set.
    environment: release
    # gh release needs write permission; the package registry needs it for
    # the "latest" tag that is moved onto the signed image below.
    permissions:
      contents: write
      packages: write
    env:
      # The digest of the published image. The version tag is mutable — a
      # re-run overwrites it — so the digest is what identifies the image
      # this release published.
      IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
    steps:
      # gh requires the working directory to be a git repo; fetch-depth: 0 keeps
      # --generate-notes able to diff against the previous tag
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-07-17
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        env:
          # Through the environment rather than into the script text: a value
          # interpolated into a `run:` block is text the shell runs, and a
          # dispatch input is a value somebody typed.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The release scripts and this workflow, checked before anything is
      # published: a platform that quietly drops out of the updater manifest
      # is a release that looks green and reaches half its users without an
      # update. The self-test builds the bundles Tauri builds and checks what
      # the scripts would publish.
      - name: Check the release scripts
        shell: bash
        run: node ui-desktop/.github/scripts/selftest.mjs

      - name: Download server artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 @ 2026-10-07
        with:
          pattern: ${{ env.BIN_NAME }}-*
          merge-multiple: true
          path: dist-server

      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 @ 2026-10-07
        with:
          pattern: dist-desktop-*
          merge-multiple: true
          path: dist-desktop

      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 @ 2026-10-07
        with:
          pattern: dist-apk
          merge-multiple: true
          path: dist-apk

      # Merge the per-platform updater manifests (latest-*.json) into a single
      # latest.json and collect the desktop bundles into dist/.
      - name: Assemble desktop release files
        env:
          DIST_DIR: dist-desktop
          OUT_DIR: dist
        run: node ui-desktop/.github/scripts/assemble-release.mjs

      - name: Stage every artifact into one directory
        shell: bash
        run: |
          set -euo pipefail
          # The desktop SHA256SUMS.txt covers desktop files only and would clash
          # with the global one generated below.
          rm -f dist/SHA256SUMS.txt
          cp dist-server/* dist/
          cp dist-apk/* dist/
          echo "--- release contents ---"
          ls -lh dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # One SHA256SUMS.txt over every asset: server archives, desktop
          # bundles + latest.json, and the APK (which keeps its own .sha256
          # sidecar too, for direct downloads on a phone).
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The checksum file is signed with the updater key, the same key every
      # other artifact of the release is signed with.
      #
      # Without a signature the checksum file is only as trustworthy as the
      # download that carried it: anybody who can replace an artifact can
      # replace the list of checksums that says the artifact is intact. The
      # signature is what makes the two independent.
      - name: Sign the checksum file
        shell: bash
        working-directory: ui-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::no updater signing key is configured: SHA256SUMS.txt is published unsigned"
            exit 0
          fi
          # The same lockfile-pinned Tauri CLI that signs the bundles signs
          # the checksum file, so the signature is the same kind of signature.
          npm ci --no-audit --no-fund
          npx tauri --version
          rm -f ../dist/SHA256SUMS.txt.sig
          npx tauri signer sign --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ../dist/SHA256SUMS.txt
          test -f ../dist/SHA256SUMS.txt.sig
          echo "signed: SHA256SUMS.txt"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail

          # A version containing a hyphen (v0.2.0-rc.1 / -beta.1 / -alpha.3) is a
          # pre-release; a plain version (v1.0.0) is not. Same rule in every job,
          # so a release-candidate tag never replaces "latest".
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease=true" ;;
            *)   PRERELEASE_FLAG="--prerelease=false" ;;
          esac
          echo "TAG_NAME=$TAG_NAME VERSION=$VERSION PRERELEASE_FLAG=$PRERELEASE_FLAG"

          # The index files and the payloads are uploaded in two steps, and the
          # index files go last.
          #
          # latest.json names the payload of every platform, and
          # SHA256SUMS.txt lists every asset: they are only true once the
          # assets they name are there. Uploading them together means that
          # for as long as the ~750 MB of payloads are on their way,
          # "releases/latest/download/latest.json" is live and points at
          # assets that answer 404 — and the updater downloads them.
          PAYLOAD_FILES=()
          INDEX_FILES=()
          for f in dist/*; do
            case "$(basename "$f")" in
              latest.json|SHA256SUMS.txt|SHA256SUMS.txt.sig) INDEX_FILES+=("$f") ;;
              *) PAYLOAD_FILES+=("$f") ;;
            esac
          done
          echo "payloads: ${#PAYLOAD_FILES[@]}, index files: ${#INDEX_FILES[@]}"

          # The note that says, in the release notes, that some of the artifacts
          # are unsigned. The opt-out is deliberate and has to be visible to
          # the person who installs the app, not only to the person who ran
          # the workflow — so the warning goes at the top of the notes.
          UNSIGNED_NOTE=""
          if [ -n "$ALLOW_UNSIGNED" ]; then
            echo "::warning::this release publishes unsigned artifacts: $ALLOW_UNSIGNED"
            items=""
            for platform in ${ALLOW_UNSIGNED//,/ }; do
              case "$platform" in
                macos)
                  items+=$'> - `macos` — the `.dmg` and the `.app` inside it carry no Developer ID signature and are not notarized. macOS Gatekeeper refuses them until the user allows it by hand.\n'
                  ;;
                windows)
                  items+=$'> - `windows` — the NSIS installer (`-setup.exe`) carries no Authenticode signature. Windows SmartScreen refuses it until the user allows it by hand.\n'
                  ;;
                *)
                  items+="> - $platform\n"
                  ;;
              esac
            done
            UNSIGNED_NOTE=$'> [!WARNING]\n> **This release contains unsigned artifacts.**\n>\n'
            UNSIGNED_NOTE+="> The run was dispatched with \`allow_unsigned=$ALLOW_UNSIGNED\`, so the following platforms were published **without a code signature**:"$'\n'
            UNSIGNED_NOTE+="$items"
            UNSIGNED_NOTE+=$'>\n> macOS Gatekeeper and Windows SmartScreen refuse such an artifact until the user allows it by hand.\n'
          fi

          # The digest of the published image. The version tag is mutable — a
          # re-run overwrites it — and the digest appears nowhere else a user
          # looks, so the release notes carry it.
          IMAGE_NOTE=""
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            IMAGE_NOTE="$(printf '> [!NOTE]\n> **Container image.** This release publishes %s.\n>\n> The version tag is mutable; this digest is not.\n' "\`ghcr.io/open-nexa/nexapipe@${IMAGE_DIGEST}\`")"
          fi

          NOTES="${UNSIGNED_NOTE}${IMAGE_NOTE}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, overwriting the uploaded artifacts"
            # The same order as the create path: the payloads first, the
            # index files last.
            if [ "${#PAYLOAD_FILES[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${PAYLOAD_FILES[@]}" --clobber
            fi
            if [ "${#INDEX_FILES[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${INDEX_FILES[@]}" --clobber
            fi
            # `gh release upload` cannot flip the flag, so keep an already
            # published release (e.g. a re-run) in sync with the rule as well.
            gh release edit "$TAG_NAME" "$PRERELEASE_FLAG"
            # An existing release keeps the notes it has, so the notes this
            # run adds are prepended to them.
            BODY="$(gh release view "$TAG_NAME" --json body --jq .body)"
            {
              if [ -n "$UNSIGNED_NOTE" ] && ! printf '%s' "$BODY" | grep -qF "This release contains unsigned artifacts"; then
                printf '%s\n\n' "$UNSIGNED_NOTE"
              fi
              if [ -n "$IMAGE_NOTE" ] && ! printf '%s' "$BODY" | grep -qF "$IMAGE_DIGEST"; then
                printf '%s\n\n' "$IMAGE_NOTE"
              fi
              printf '%s' "$BODY"
            } > "$RUNNER_TEMP/release-notes.md"
            gh release edit "$TAG_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            # `--notes` is prepended to the generated notes, so the warnings
            # come first.
            if [ "${#PAYLOAD_FILES[@]}" -gt 0 ]; then
              gh release create "$TAG_NAME" "${PAYLOAD_FILES[@]}" \
                --title "$TAG_NAME" \
                --generate-notes \
                --notes "$NOTES" \
                --verify-tag \
                "$PRERELEASE_FLAG"
            else
              gh release create "$TAG_NAME" \
                --title "$TAG_NAME" \
                --generate-notes \
                --notes "$NOTES" \
                --verify-tag \
                "$PRERELEASE_FLAG"
            fi
            # The index files go up once every asset they name is there.
            if [ "${#INDEX_FILES[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${INDEX_FILES[@]}"
            fi
          fi

      # The "latest" tag of the container image is moved here, and not in the
      # publish-image job: a user who pulls "latest" has to find the release
      # that carries the server binaries of the same version, and that
      # release exists only once the step above has created it.
      #
      # The manifest is copied byte for byte, so the digest does not change.
      # The cosign signature is bound to that digest, and the command the
      # README gives — "cosign verify ghcr.io/open-nexa/nexapipe:latest" —
      # has to resolve the tag to exactly the manifest that was signed.
      # Rebuilding the manifest list instead would produce a different digest
      # and leave the tag unsigned.
      - name: Move the image's latest tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail

          # A pre-release never takes "latest" away from a stable one.
          case "$VERSION" in
            *-*) echo "a pre-release does not move the latest tag"; exit 0 ;;
          esac

          REGISTRY="ghcr.io"
          REPOSITORY="open-nexa/nexapipe"
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json"

          TOKEN="$(curl -fsS -u "${GH_USER}:${GH_TOKEN}" \
            "https://${REGISTRY}/token?service=${REGISTRY}&scope=repository:${REPOSITORY}:pull,push" \
            | jq -r .token)"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::could not get a registry token for ${REGISTRY}"
            exit 1
          fi

          MANIFEST="$RUNNER_TEMP/manifest.json"
          curl -fsS -D "$RUNNER_TEMP/manifest.headers" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: ${ACCEPT}" \
            "https://${REGISTRY}/v2/${REPOSITORY}/manifests/${IMAGE_DIGEST}" \
            -o "$MANIFEST"
          MEDIA_TYPE="$(grep -i '^content-type:' "$RUNNER_TEMP/manifest.headers" | tail -n1 | tr -d '\r' | cut -d' ' -f2)"
          if [ -z "$MEDIA_TYPE" ]; then
            echo "::error::the registry did not say which media type the manifest has"
            exit 1
          fi

          STATUS="$(curl -fsS -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: ${MEDIA_TYPE}" \
            --data-binary "@${MANIFEST}" \
            "https://${REGISTRY}/v2/${REPOSITORY}/manifests/latest")"
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "200" ]; then
            echo "::error::the registry refused to move the latest tag (HTTP ${STATUS})"
            exit 1
          fi

          # The tag has to resolve to the manifest that was signed.
          curl -fsS -D "$RUNNER_TEMP/latest.headers" -o /dev/null \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: ${ACCEPT}" \
            "https://${REGISTRY}/v2/${REPOSITORY}/manifests/latest"
          ACTUAL="$(grep -i '^docker-content-digest:' "$RUNNER_TEMP/latest.headers" | tr -d '\r' | cut -d' ' -f2)"
          if [ "$ACTUAL" != "$IMAGE_DIGEST" ]; then
            echo "::error::the latest tag resolves to ${ACTUAL}, not to the signed ${IMAGE_DIGEST}"
            exit 1
          fi

          echo "ghcr.io/${REPOSITORY}:latest now points at ${IMAGE_DIGEST}"
