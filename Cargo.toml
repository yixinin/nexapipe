[workspace]
members = [
    "crates/nexapipe",
    "crates/nexapipe-client",
    "crates/nexapipe-proto",
]
exclude = ["ui-desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
# The floor is the higher of two things this workspace needs:
#
# - 1.89, where `File::lock` / `File::unlock` were stabilised, which the config
#   lock uses for `flock(2)` and `LockFileEx`.
# - 1.95, where `Atomic::try_update` was stabilised, which the traffic and byte
#   budget counters use to read a counter and write it back in one step.
#
# Declared rather than left implicit: without it an older toolchain fails
# somewhere inside the dependency graph, on an error that names neither this
# crate nor the standard-library call that raised it — and every crate in the
# workspace is built by the same toolchain, so this is one number for all of
# them. The `msrv` job in .github/workflows/ci.yml builds the workspace on
# exactly this version, so the number is checked rather than only stated.
rust-version = "1.95"

# Vendor smoltcp 0.12.0 with a minimal patch guarding the unguarded
# `remote_last_seq - local_seq_no` subtraction in the TCP transmit path.
# Without it, real-world traffic (e.g. retransmissions) can trigger
# `panic: attempt to subtract sequence numbers with underflow` in
# smoltcp-0.12.0/src/wire/tcp.rs, which kills the TUN proxy stack and
# disconnects the tunnel a few seconds after connecting.
#
# What exactly is patched, why, and when this can be dropped once upstream
# fixes the panic: see third_party/smoltcp/PATCHES.md. Do not remove this
# entry, or edit the vendored copy, without reading that file first.
[patch.crates-io]
smoltcp = { path = "third_party/smoltcp" }

[profile.release]
panic = "unwind"
# "s" put smoltcp's packet path, the QUIC AEAD and rustls under size optimisation.
# 3 is the single cheapest throughput win available here.
opt-level = 3
codegen-units = 1
lto = true
debug = "none"
strip = true

[workspace.dependencies]
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring"] }
iroh-tickets = { version = "1.0.0" }
# The quinn fork iroh itself builds on. `iroh` depends on this exact crate, so the
# `ControllerFactory` it re-exports and the concrete controllers below are the same
# types. The workspace's older `quinn` alias is a different fork, and naming it
# would give a trait that does not match.
noq-proto = { version = "1.3.0", default-features = false }
quinn = { version = "0.16", package = "iroh-quinn" }
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.103"
http = "1.4.2"
url = "2.5.8"
rustls = { version = "0.23.40", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
hyper = { version = "1.10.1", features = ["full", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-stream = "0.1"
bytes = "1.12.0"
futures-util = "0.3.32"
nexapipe-proto = { path = "crates/nexapipe-proto", version = "1.0.1" }
# Wiping credentials from memory when they go out of scope. The RustCrypto
# crate the tree already pulls in through rustls, used directly so the server
# and the client can share one wrapper for it — see `nexapipe_client::secret`.
zeroize = "1.9"
# The benchmarks. A dev-dependency of the two crates that carry traffic, so
# the measured code is the code that ships — see docs/benchmarks.md.
criterion = "0.8"
