[package]
name = "nexapipe"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = { version = "1.0.0" }
quinn = { version = "0.16", package = "iroh-quinn" }
rand = "0.10.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.10"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
data-encoding = "2.11.0"
n0-error = "1.0.0"
async-trait = "0.1"
pingora = { version = "0.8.0", features = ["rustls", "lb"] }
anyhow = "1.0.103"
http = "1.4.2"
url = "2.5"
toml = "1.1.2"
serde = { version = "1.0.203", features = ["derive"] }
rustls = "0.23.40"
tokio-rustls = "0.26.4"
rustls-native-certs = "0.8.4"
webpki-roots = "1.0.8"
rustls-pemfile = "2.0"
rustls-pki-types = "1.14.1"
# ACME certificate management
instant-acme = { version = "0.8.5", features = ["hyper-rustls", "aws-lc-rs"] }
cloudflare = { version = "0.14.0" }
# Certificate utilities
x509-parser = "0.18.1"
chrono = { version = "0.4.38", features = ["serde"] }
futures-util = "0.3.30"
base64 = "0.22"
sha1 = "0.10"
hyper = { version = "1.3", features = ["full", "http2"] }
hyper-util = { version = "0.1", features = ["full"] }
hyper-rustls = "0.27"
http-body-util = "0.1"
tokio-stream = "0.1"
async-compression = { version = "0.4", features = ["gzip", "brotli", "tokio"] }
flate2 = "1.0"
bytes = "1.6"
lazy_static = "1.4"

[dev-dependencies]
duct = "1.1.1"
nix = { version = "0.31.3", features = ["signal", "process"] }
tempfile = "3.8"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true
