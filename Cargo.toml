[package]
name = "nexapipe"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = { version = "1.0.0" }
quinn = { version = "0.16", package = "iroh-quinn" }
rand = "0.10.1"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.10"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
data-encoding = "2.11.0"
n0-error = "1.0.0"
async-trait = "0.1"
pingora = { version = "0.8.0", features = ["openssl", "lb"] }
anyhow = "1.0.71"
http = "1.4.2"
url = "2.5"

[dev-dependencies]
duct = "1.1.1"
nix = { version = "0.31.3", features = ["signal", "process"] }
tempfile = "3.8"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true
